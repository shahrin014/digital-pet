name: Deploy to GitHub Pages

on:
  push:
    branches:
      - nightly
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whether GitHub Pages is enabled
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          status=$(printf '%s\n' "$response" | tail -n1)
          body=$(printf '%s\n' "$response" | sed '$d')
          build_type=$(printf '%s\n' "$body" | jq -r '.build_type // empty' 2>/dev/null || true)
          if [ "$status" = "200" ] && [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled with GitHub Actions as the source (API status ${status}, build type ${build_type:-unknown}). Enable Pages with GitHub Actions as the source, then re-run this workflow."
          fi

      - name: Configure Pages
        if: steps.pages_status.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # When Pages is enabled, build for the repository subpath. Otherwise
          # still build (as a verification step) using the site root.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
